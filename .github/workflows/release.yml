name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  release:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Package
        run: |
          cp README.md .build/release/README.md
          cd .build/release
          zip -X "../../osaurus.ticktick-${GITHUB_REF_NAME}.zip" libosaurus-ticktick.dylib README.md
          cd ../..
          rm -f .build/release/README.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: osaurus.ticktick-${{ github.ref_name }}.zip
          generate_release_notes: true
