name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  release:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' from tag (v0.1.0 → 0.1.0)
          VERSION="${VERSION#v}"
          cp README.md .build/release/README.md
          cd .build/release
          zip -X "../../osaurus.ticktick-${VERSION}.zip" libosaurus-ticktick.dylib README.md
          cd ../..
          rm -f .build/release/README.md
          ls -la osaurus.ticktick-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: osaurus.ticktick-*.zip
          generate_release_notes: true
