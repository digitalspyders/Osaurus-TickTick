name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  release:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Package
        run: |
          echo "=== Build output ==="
          find .build -name "*.dylib" -type f
          echo "=== Creating zip ==="
          DYLIB_PATH=$(find .build -name "libosaurus-ticktick.dylib" -type f | head -1)
          if [ -z "$DYLIB_PATH" ]; then
            echo "ERROR: No dylib found"
            exit 1
          fi
          echo "Using dylib: $DYLIB_PATH"
          DYLIB_DIR=$(dirname "$DYLIB_PATH")
          cp README.md "$DYLIB_DIR/README.md"
          cd "$DYLIB_DIR"
          zip -X "$GITHUB_WORKSPACE/osaurus.ticktick-0.1.0.zip" libosaurus-ticktick.dylib README.md
          cd "$GITHUB_WORKSPACE"
          echo "=== Result ==="
          ls -la osaurus.ticktick-0.1.0.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: osaurus.ticktick-0.1.0.zip
          generate_release_notes: true
