name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test

  release:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip leading 'v' from tag (v0.1.0 → 0.1.0)
          VERSION="${VERSION#v}"
          echo "Packaging version: ${VERSION}"
          # Find the dylib wherever swift build put it
          DYLIB=$(find .build -name "libosaurus-ticktick.dylib" -type f | head -1)
          echo "Found dylib: ${DYLIB}"
          if [ -z "$DYLIB" ]; then
            echo "ERROR: dylib not found. Build output:"
            find .build -name "*.dylib" -type f
            exit 1
          fi
          DYLIB_DIR=$(dirname "$DYLIB")
          cp README.md "$DYLIB_DIR/README.md"
          (cd "$DYLIB_DIR" && zip -X "../../osaurus.ticktick-${VERSION}.zip" libosaurus-ticktick.dylib README.md)
          rm -f "$DYLIB_DIR/README.md"
          echo "Package created:"
          ls -la osaurus.ticktick-*.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: osaurus.ticktick-*.zip
          generate_release_notes: true
